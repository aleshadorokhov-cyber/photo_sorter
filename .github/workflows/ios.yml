name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Отправить сборку в TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка для симулятора
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Модель из кеша
        id: model-cache
        uses: actions/cache@v4
        with:
          path: PhotoSorter/Generated
          key: model-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Подготовить модель для iPhone
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r ml/requirements.txt
          python ml/export_models.py

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Собрать
        run: |
          xcodebuild -version
          xcodebuild build \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  testflight:
    name: Сборка в TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Модель из кеша
        id: model-cache
        uses: actions/cache@v4
        with:
          path: PhotoSorter/Generated
          key: model-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Подготовить модель для iPhone
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r ml/requirements.txt
          python ml/export_models.py

      - name: Проверить секреты
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Не задан секрет $name"; exit 1; fi
          done

      - name: Ключ App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Архив
        run: |
          xcodebuild archive \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PhotoSorter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet

      - name: Отправить в TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PhotoSorter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
