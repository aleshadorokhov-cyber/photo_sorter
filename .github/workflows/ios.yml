name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Отправить сборку в TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и проверка
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Модель из кеша
        id: model-cache
        uses: actions/cache@v4
        with:
          path: PhotoSorter/Generated
          key: model-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Подготовить модель для iPhone
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r ml/requirements.txt
          python ml/export_models.py

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Собрать и проверить модель на симуляторе
        run: |
          set -o pipefail
          xcodebuild -version
          # Первый доступный симулятор iPhone
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))
          ")
          xcodebuild test \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Debug \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E "Близость|error:|Test Case|Executed|\*\* (BUILD|TEST)"

  sidestore:
    name: Сборка .ipa для SideStore
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Модель из кеша
        id: model-cache
        uses: actions/cache@v4
        with:
          path: PhotoSorter/Generated
          key: model-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Подготовить модель для iPhone
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r ml/requirements.txt
          python ml/export_models.py

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      # Без подписи: SideStore сам подпишет приложение Apple ID пользователя при установке.
      - name: Собрать .ipa без подписи
        run: |
          xcodebuild build \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/PhotoSorter.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PhotoSorter.ipa" Payload)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_ENV"
          ls -lh PhotoSorter.ipa

      # Источник собирается на каждой сборке, чтобы ошибки в нём ловились ещё в PR.
      - name: Источник для SideStore
        env:
          BUILD: ${{ github.run_number }}
        run: |
          TAG="v$VERSION-$BUILD"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/PhotoSorter.ipa"
          python3 sidestore/make_source.py --app "$APP" --ipa PhotoSorter.ipa --url "$URL" \
            --notes "$(git log -1 --format=%s)" --out source.json
          cat source.json

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-ipa
          path: |
            PhotoSorter.ipa
            source.json

      # Только для main: новая версия появляется в SideStore как обновление.
      - name: Выложить в Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" PhotoSorter.ipa source.json \
            --target "$GITHUB_SHA" \
            --title "По полочкам $TAG" \
            --notes "$(git log -1 --format=%s)" \
            --latest

  testflight:
    name: Сборка в TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Модель из кеша
        id: model-cache
        uses: actions/cache@v4
        with:
          path: PhotoSorter/Generated
          key: model-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Подготовить модель для iPhone
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r ml/requirements.txt
          python ml/export_models.py

      - name: Проверить секреты
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Не задан секрет $name"; exit 1; fi
          done

      - name: Ключ App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Архив
        run: |
          xcodebuild archive \
            -project PhotoSorter.xcodeproj \
            -scheme PhotoSorter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PhotoSorter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet

      - name: Отправить в TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PhotoSorter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
