name: Web

on:
  push:
    branches: [main, claude/web-version]
    paths:
      - "web/**"
      - "ml/**"
      - "PhotoSorter/Resources/taxonomy.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Собрать и выложить веб-версию
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Модели из кеша
        id: models
        uses: actions/cache@v4
        with:
          path: web-build/models
          key: web-models-${{ hashFiles('ml/**', 'PhotoSorter/Resources/taxonomy.json') }}

      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      # Модель для фото та же, что в приложении для iPhone, только в ONNX.
      # EmbeddingGemma для темы текста берётся из открытого хранилища моделей MediaPipe.
      - name: Подготовить модели
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          # MediaPipe для Python подгружает библиотеки EGL/GLES даже на процессоре.
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libegl1 libgles2
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch==3.3.0 numpy onnx==1.23.2 onnx-ir==1.0.0 onnxruntime==1.29.0 mediapipe==1.1.0
          python ml/export_web.py --out web-build/models
          curl -sfL -o web-build/models/embedding_gemma.task \
            https://storage.googleapis.com/mediapipe-models/text_embedder/embedding_gemma/int4int8/latest/embedding_gemma.task
          python ml/export_topics.py --model web-build/models/embedding_gemma.task --out web-build/models
          python ml/export_cities.py --out web-build/models --cache "$RUNNER_TEMP/geonames"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать сайт
        run: |
          (cd web && npm ci --no-audit --no-fund)
          bash web/build.sh web-build/models _site

      # Каждый раз ветка gh-pages заменяется целиком, чтобы старые модели не копились в истории
      - name: Выложить на GitHub Pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Веб-версия из ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # Подстраховка: просим GitHub Pages пересобрать сайт, если push от бота не запустил сборку сам
      - name: Обновить GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Не удалось запросить сборку GitHub Pages"
