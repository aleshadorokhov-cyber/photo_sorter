name: Shortcuts probe
on:
  push:
    branches: [claude/shortcut-probe]
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Версии
        run: sw_vers; which shortcuts; shortcuts --help 2>&1 | head -30; shortcuts sign --help 2>&1 | head -30
      - name: Действия Фото (App Intents)
        continue-on-error: true
        run: |
          for app in /System/Applications/Photos.app; do
            find "$app" -name "*.actionsdata" -o -name "*.appintents" | head
          done
          F=$(find /System/Applications/Photos.app -name "extract.actionsdata" | head -1)
          echo "file: $F"
          python3 - "$F" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          acts = d.get('actions', {})
          print('actions:', len(acts))
          for name, a in acts.items():
              title = a.get('title', {}).get('key', '')
              params = [(p.get('name'), p.get('valueType', {}).get('primitive', p.get('valueType', {}).get('entity', p.get('valueType')))) for p in a.get('parameters', [])]
              print(name, '|', title, '|', json.dumps(params, ensure_ascii=False)[:600])
          PY
      - name: Подробно про альбомы
        continue-on-error: true
        run: |
          F=$(find /System/Applications/Photos.app -name "extract.actionsdata" | head -1)
          python3 - "$F" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          for name, a in d.get('actions', {}).items():
              if 'Album' in name or 'album' in json.dumps(a).lower()[:2000]:
                  print('=====', name)
                  print(json.dumps(a, ensure_ascii=False)[:4000])
          ents = d.get('entities', {})
          print('entities:', list(ents)[:50])
          for k in ents:
              if 'Album' in k or 'Asset' in k:
                  print('=====', k); print(json.dumps(ents[k], ensure_ascii=False)[:3000])
          PY
      - name: Старые действия WorkflowKit
        continue-on-error: true
        run: |
          find /System/Library/PrivateFrameworks /System/Library/Frameworks -maxdepth 6 -iname '*WFActions*' 2>/dev/null | head; find /System/Library/PrivateFrameworks -maxdepth 5 -iname '*.plist' -path '*Workflow*' 2>/dev/null | head -20; find /System/Library/PrivateFrameworks -maxdepth 5 -iname '*.plist' -path '*ActionKit*' 2>/dev/null | head -20
          P=$(find /System/Library/PrivateFrameworks -maxdepth 7 -name "WFActions.plist" 2>/dev/null | head -1)
          echo "plist: $P"
          plutil -convert json -o /tmp/wfactions.json "$P"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/wfactions.json'))
          for k, v in d.items():
              if any(s in k.lower() for s in ('photo', 'album', 'cameraroll')):
                  print('=====', k, v.get('Name'), v.get('ActionClass'))
                  print(json.dumps({x: v[x] for x in v if x in ('Parameters', 'Input', 'Output', 'ParameterSummary')}, ensure_ascii=False, default=str)[:2500])
          PY
      - name: Свойства фото для фильтра
        continue-on-error: true
        run: |
          grep -rl "WFPhotoMediaContentItem\|WFAssetContentItem" /System/Library/PrivateFrameworks/ContentKit.framework 2>/dev/null | head
          strings /System/Library/PrivateFrameworks/ContentKit.framework/Versions/A/ContentKit 2>/dev/null | grep -i -E "^(Date Taken|Creation Date|Album|Name|File Name|Is a Screenshot)$" | sort -u | head -20
      - name: Подпись команды
        run: |
          cat > t.plist <<'PL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>WFWorkflowActions</key><array>
          <dict><key>WFWorkflowActionIdentifier</key><string>is.workflow.actions.notification</string>
          <key>WFWorkflowActionParameters</key><dict><key>WFNotificationActionBody</key><string>Проверка</string></dict></dict>
          </array>
          <key>WFWorkflowClientVersion</key><string>2607.0.2</string>
          <key>WFWorkflowIcon</key><dict><key>WFWorkflowIconGlyphNumber</key><integer>59511</integer><key>WFWorkflowIconStartColor</key><integer>4282601983</integer></dict>
          <key>WFWorkflowImportQuestions</key><array/>
          <key>WFWorkflowInputContentItemClasses</key><array/>
          <key>WFWorkflowMinimumClientVersion</key><integer>900</integer>
          <key>WFWorkflowTypes</key><array/>
          </dict></plist>
          PL
          plutil -convert binary1 -o t.shortcut t.plist
          shortcuts sign --mode anyone --input t.shortcut --output t-signed.shortcut 2>&1 | tail -5 || true
          ls -la t.shortcut t-signed.shortcut 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: t-signed.shortcut
          if-no-files-found: ignore
