name: Shortcut

# Собирает команду «Разложить по полочкам» и подписывает её на Mac,
# чтобы iPhone мог поставить её из файла одним касанием.
on:
  push:
    branches: [main, claude/web-version]
    paths:
      - "shortcut/**"
      - ".github/workflows/shortcut.yml"
  workflow_dispatch:

jobs:
  sign:
    name: Собрать и подписать команду
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Собрать
        run: |
          mkdir -p out
          python3 shortcut/build.py out/unsigned.plist
          plutil -convert binary1 -o "out/Разложить по полочкам.unsigned.shortcut" out/unsigned.plist
          sw_vers

      - name: Подписать
        run: |
          shortcuts sign --help || true
          shortcuts sign --mode anyone \
            --input "out/Разложить по полочкам.unsigned.shortcut" \
            --output "out/Разложить по полочкам.shortcut"
          head -c 4 "out/Разложить по полочкам.shortcut" | xxd
          test "$(head -c 4 "out/Разложить по полочкам.shortcut")" = "AEA1"
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortcut
          path: out/
