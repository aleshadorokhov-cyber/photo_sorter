name: PhotoSorter
options:
  bundleIdPrefix: com.aleshadorokhov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoSorter:
    type: application
    platform: iOS
    sources:
      - path: PhotoSorter
        excludes:
          - "Generated/**"
      # Готовит ml/export_models.py (в CI это делает .github/workflows/ios.yml)
      - path: PhotoSorter/Generated/ImageEncoder.mlpackage
        type: file
        buildPhase: sources
      - path: PhotoSorter/Generated/categories.f32
        buildPhase: resources
      - path: PhotoSorter/Generated/labels.f32
        buildPhase: resources
    scheme:
      testTargets:
        - PhotoSorterTests
    info:
      path: PhotoSorter/Info.plist
      properties:
        CFBundleDisplayName: По полочкам
        # XcodeGen по умолчанию пишет сюда 1.0 и 1, а номер сборки должен расти с каждой сборкой в CI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Приложение разбирает фото прямо на телефоне, чтобы разложить их по категориям. Сами фото никуда не отправляются.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleshadorokhov.photosorter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  # Проверяет на симуляторе, что модель в Core ML считает так же, как исходная в PyTorch.
  PhotoSorterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoSorterTests
      - path: PhotoSorter/Generated/reference.f32
        buildPhase: resources
    dependencies:
      - target: PhotoSorter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
